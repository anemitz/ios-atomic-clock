name: iOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Reject personal signing configuration
        shell: bash
        run: |
          if git grep -n -E \
            'DEVELOPMENT_TEAM[[:space:]]*=[[:space:]]*[A-Z0-9]{10}'; then
            echo "Move DEVELOPMENT_TEAM to Config/Signing.local.xcconfig." >&2
            exit 1
          fi
          if git ls-files --error-unmatch \
            Config/Signing.local.xcconfig >/dev/null 2>&1; then
            echo "Config/Signing.local.xcconfig must not be committed." >&2
            exit 1
          fi

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          simulator_id="$(
            xcrun simctl list devices available |
              awk -F '[()]' '/iPhone/ && /(Shutdown|Booted)/ { print $2; exit }'
          )"
          if [[ -z "$simulator_id" ]]; then
            echo "No available iPhone simulator was found." >&2
            exit 1
          fi
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          xcodebuild \
            -project AtomicClock.xcodeproj \
            -scheme AtomicClock \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath /tmp/AtomicClockTestDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test
